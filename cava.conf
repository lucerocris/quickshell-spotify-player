; Music app visualizer: 12 slow, soft bands, mirrored into 23 bars (read by shell.qml). Runs only while the window is open and music plays.
[general]
framerate = 30
bars = 12
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 88
monstercat = 1
